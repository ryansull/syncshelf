[project]
name = "syncshelf"
version = "0.2.0"
description = "Self-hosted MCP server and one-way syncs that keep Hardcover as a household's reading log."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
# SPEC §2.1 as far as phase 3 (PyJWT checks the Access JWT; rapidfuzz scores matches). Later
# phases add playwright.
dependencies = [
    "httpx2>=2.13",
    "mcp>=2.3,<3",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6",
    "rapidfuzz>=3,<4",
    "starlette>=1.8,<2",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "anyio>=4",
    "pre-commit>=4",
    "pyright>=1.1.400",
    "pytest>=9.1",
    "pytest-cov>=7",
    "pytest-socket>=0.8",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Harness helpers in tests/, imported through pytest's pythonpath.
known-local-folder = ["access_jwt", "cimd_docs", "clock", "fakes", "image", "invariants", "oauth_flow", "scrub", "serving"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
# tests/ holds harness helpers (fixture scrubber) that tests and tests/live/record.py import.
pythonpath = ["tests"]
# Outbound sockets are blocked (SPEC §2.9). Loopback stays open because asyncio on Windows
# builds its self-pipe from a loopback TCP pair, and in-process ASGI tests never leave the host.
addopts = [
    "--strict-markers",
    "--allow-hosts=127.0.0.1,::1",
    "--cov=syncshelf",
    "--cov-report=term-missing",
]
# Per test, not per run. The slowest test takes about 3 s; a hang fails with a stack trace
# instead of stalling the run.
timeout = 60
markers = [
    "live: talks to a real service; collected only with --live and SYNCSHELF_LIVE=1",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["syncshelf"]
