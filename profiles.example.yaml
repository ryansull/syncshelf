# SyncShelf configuration (SPEC §2.3)
#
# Copy to profiles.yaml (git-ignored) and point SYNCSHELF_CONFIG at it; the container default
# is /config/profiles.yaml. Secrets never go in this file. Write each one as a reference:
#
#   key: ${ENV_VAR}           expanded from SyncShelf's own environment
#   key_file: /run/secrets/x  read from a file
#
# Only secret keys expand ${VAR}; every other value is taken literally. A missing variable or
# file stops startup with a message naming the key.
#
# Every key validated so far is set below. Lines commented out are keys that later work
# reads; SPEC §2.3 shows the full shape. A secret key that is present is expanded from
# phase 1 on, so leave a secret commented out until its variable or file exists.

server:
  # The issuer URL: the public name Claude connects to, behind the reverse proxy. Just the
  # scheme, a lowercase host and any port other than the scheme's default, with no path, not
  # even a trailing slash. Only oauth mode serves a host other than localhost or 127.0.0.1,
  # and it must be https. Log lines show its host as public, and the team_domain host below
  # as access.
  public_url: https://shelf.example.com
  # oauth | dev. Every /mcp request needs a bearer token, and with this key absent none is
  # accepted. oauth is how Claude connects: SyncShelf is its own OAuth server, and Cloudflare
  # Access does the login at /authorize. dev accepts one static token instead, for Claude
  # Code or MCP Inspector against a local instance; see the dev section below.
  auth_mode: oauth
  # The Cloudflare Access app guarding /authorize (GET and POST). All three keys are required
  # in oauth mode.
  access:
    team_domain: https://example.cloudflareaccess.com   # just https:// and the team's host
    aud: ${ACCESS_AUD}                      # the Access app's AUD tag
  consent_hmac_key: ${CONSENT_HMAC_KEY}     # signs the consent form blob
  # Only read when auth_mode: dev. For a local instance, set auth_mode: dev and public_url:
  # http://localhost:8000 (dev mode refuses any other host), uncomment this section, and
  # comment out aud and consent_hmac_key above. A secret that is present is expanded in any
  # mode, so each mode keeps only its own secrets uncommented. The token is the only thing
  # guarding /mcp, so keep the instance off the network: publish the port on loopback only
  # (e.g. -p 127.0.0.1:8000:8000), or set listen below to 127.0.0.1:8000.
  # dev:
  #   # A random string of at least 32 characters, e.g. from: openssl rand -hex 32. Clients
  #   # send it as "Authorization: Bearer <token>".
  #   token: ${SYNCSHELF_DEV_TOKEN}
  #   profile: alice                        # the profile the token acts as
  # Addresses or networks (comma-separated) trusted to set X-Forwarded-* headers: the Traefik
  # network in production, or 127.0.0.1 when running locally without a proxy.
  forwarded_allow_ips: 192.0.2.0/24
  # Where the service listens, as host:port (an IPv6 address in brackets, e.g. [::]:8000).
  # Default 0.0.0.0:8000, every interface. In the container, keep port 8000: the image's
  # health check probes 127.0.0.1:8000.
  listen: 0.0.0.0:8000
  # DEBUG | INFO | WARNING | ERROR (default INFO)
  log_level: INFO

services:
  # Each URL must have a host. hardcover_url is required; the others are optional until the
  # phase that uses them. Log lines show each host as the service's alias (hardcover, abs,
  # chaptarr, browser).
  hardcover_url: https://api.hardcover.app/v1/graphql
  abs_url: https://abs.home.arpa            # HTTPS form; http 302s
  chaptarr_url: http://chaptarr.home.arpa
  # chaptarr_api_key: ${CHAPTARR_API_KEY}
  browser_ws: ws://browser:3000/            # playwright run-server sidecar (4b); absent = 4b disabled

cadence:                                    # all optional; defaults shown, written <n>m or <n>h
  rss_interval: 60m
  abs_interval: 15m
  chaptarr_pending_interval: 2m
  mirror_ttl: 10m
  # csv_interval_days: 5
  # csv_window: "02:00-05:00"               # in each profile's timezone
  # hardcover_daily_reserve: 1000

profiles:
  # Profile names match ^[a-z][a-z0-9_]{0,31}$. Emails are lowercased and must be unique.
  # Removing a profile here marks it removed at the next start and revokes its Claude
  # connections; its data is kept. Adding the name back restores it, but Claude must connect
  # again. Renaming a profile is not supported this way: it reads as a removal plus an addition.
  alice:
    email: alice@example.com
    # timezone: Etc/UTC
    permissions: [chaptarr]                 # the only permission; [] grants none
    household_visible: false                # true opts in to appearing in bob's answers
    # Hardcover -> Settings -> API. Give the token without the "Bearer " Hardcover shows in
    # front of it; SyncShelf adds its own.
    hardcover_token: ${HARDCOVER_TOKEN_ALICE}
    # hardcover_privacy: private
    # ingest_secret: ${INGEST_SECRET_ALICE}
    # goodreads:
    #   user_id: "00000000"
    #   rss_key_file: /run/secrets/gr_rss_key_alice
    #   email: ${GOODREADS_EMAIL_ALICE}
    #   password_file: /run/secrets/gr_password_alice
    #   shelf_map:
    #     read: 3
    #     currently-reading: 2
    #     to-read: 1
    # abs:
    #   token: ${ABS_TOKEN_ALICE}
  bob:
    email: bob@example.com
    permissions: [chaptarr]
    household_visible: false
    hardcover_token: ${HARDCOVER_TOKEN_BOB}
