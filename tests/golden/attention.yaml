# Attention items, raised and cleared (SPEC §3.4a.10; §2.9 golden sets).
#
# Each case gives the profile's state an hour-granular clock away from "now", and the codes
# that must come back, in order:
#   quarantined:      the error class of each quarantined change ([] for none)
#   last_success_ago: hours since the RSS source last succeeded (absent: never)
#   first_run_ago:    hours since its first run (absent: never ran)
#   due_ago:          hours since its first run was due (absent: never scheduled)
#   enabled:          whether the profile has a goodreads section (default true)
#   queued:           books in the unmatched queue
# Phase 4b, the CSV source and the Goodreads session:
#   credentials:      whether the profile has a Goodreads password (default false)
#   sidecar:          whether the stack has services.browser_ws (default false)
#   csv_success_ago:  hours since the CSV source last succeeded (absent: never)
#   csv_due_ago:      hours since the CSV source was first due (absent: never scheduled)
#   session:          the stored goodreads_sessions.state (absent: no row at all)
# The CSV source is on only with BOTH credentials and a sidecar (#232), and only then can
# `goodreads_session` or the CSV `source_stale` clause be raised.
# When a case and the spec disagree, fix the case first.

cases:
  - name: a healthy profile raises nothing
    state: {last_success_ago: 1}
    expect: []

  - name: a quarantined change raises quarantined
    state: {quarantined: [permanent], last_success_ago: 1}
    expect: [quarantined]

  - name: a quarantined bug raises hardcover_bug too
    state: {quarantined: [transient, bug], last_success_ago: 1}
    expect: [quarantined, hardcover_bug]

  - name: once released, nothing is raised
    state: {quarantined: [], last_success_ago: 1}
    expect: []

  - name: no success for over a day is stale
    state: {last_success_ago: 25}
    expect: [source_stale]

  - name: exactly a day is not yet stale
    state: {last_success_ago: 24}
    expect: []

  - name: never a success, and the first run over a day ago, is stale
    state: {first_run_ago: 25}
    expect: [source_stale]

  - name: a source just configured, never scheduled or run, is not stale
    state: {}
    expect: []

  - name: a source due over a day ago that never ran is stale (its loop is broken)
    state: {due_ago: 25}
    expect: [source_stale]

  - name: a source due within the day that hasn't run yet is not stale
    state: {due_ago: 2}
    expect: []

  - name: a source not configured is never stale
    state: {enabled: false, last_success_ago: 100}
    expect: []

  - name: the unmatched queue is never attention
    state: {queued: 5, last_success_ago: 1}
    expect: []

  - name: everything at once, in a fixed order
    state: {quarantined: [bug], last_success_ago: 48}
    expect: [quarantined, hardcover_bug, source_stale]

  # --- the CSV source and the Goodreads session (4b) ---------------------------------------

  - name: no credentials means no CSV source, whatever the session says
    state: {last_success_ago: 1, sidecar: true, session: challenged}
    expect: []

  - name: credentials but no sidecar means no CSV source either (#232)
    state: {last_success_ago: 1, credentials: true, session: challenged}
    expect: []

  - name: a signed-in CSV source with a fresh export raises nothing
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: ok,
            csv_success_ago: 1}
    expect: []

  - name: a session that needs a sign-in raises goodreads_session
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: needs_sign_in,
            csv_success_ago: 1}
    expect: [goodreads_session]

  - name: a challenged session raises goodreads_session
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: challenged,
            csv_success_ago: 1}
    expect: [goodreads_session]

  - name: a rejected password raises goodreads_session
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: bad_credentials,
            csv_success_ago: 1}
    expect: [goodreads_session]

  - name: a sign-in waiting for a code raises nothing (somebody is already on it)
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: awaiting_code,
            csv_success_ago: 1}
    expect: []

  - name: a sign-in waiting for approval raises nothing
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: awaiting_approval,
            csv_success_ago: 1}
    expect: []

  - name: a disabled session raises nothing
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: disabled,
            csv_success_ago: 1}
    expect: []

  - name: never having signed in raises goodreads_session
    state: {last_success_ago: 1, credentials: true, sidecar: true, csv_success_ago: 1}
    expect: [goodreads_session]

  - name: no CSV success for over a week is stale
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: ok,
            csv_success_ago: 169}
    expect: [source_stale]

  - name: exactly a week is not yet stale
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: ok,
            csv_success_ago: 168}
    expect: []

  - name: six days is not stale, since the CSV only runs every five
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: ok,
            csv_success_ago: 144}
    expect: []

  - name: a CSV due over a week ago that never ran is stale (its loop is broken)
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: ok,
            csv_due_ago: 169}
    expect: [source_stale]

  - name: a CSV source never scheduled or run is not stale
    state: {last_success_ago: 1, credentials: true, sidecar: true, session: ok}
    expect: []

  - name: an old CSV but no sidecar is not stale, because the source is off
    state: {last_success_ago: 1, credentials: true, csv_success_ago: 400}
    expect: []

  - name: both sources stale raise one item between them
    state: {last_success_ago: 48, credentials: true, sidecar: true, session: ok,
            csv_success_ago: 400}
    expect: [source_stale]

  - name: all four at once, in a fixed order
    state: {quarantined: [bug], last_success_ago: 48, credentials: true, sidecar: true,
            session: challenged, csv_success_ago: 400}
    expect: [quarantined, hardcover_bug, source_stale, goodreads_session]
