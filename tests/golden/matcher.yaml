# The matcher's normalisation and scoring helpers (SPEC §3.4a.5). The 4a matcher chain adds
# its own cases to this file. These cases are the decision table: when a case and the spec
# disagree, fix the case first, then the code (AGENTS.md).
#
# Normalisation order (#105): NFKD and diacritics, casefold, & → and, the trailing series
# parenthetical, then (author names only) Last, First → First Last, then punctuation and
# whitespace, then a leading article.

normalise:  # titles
  - {in: "Dune", out: "dune"}
  - {in: "  The   Hobbit ", out: "hobbit"}
  - {in: "A Wizard of Earthsea", out: "wizard of earthsea"}
  - {in: "An Ember in the Ashes", out: "ember in the ashes"}
  - {in: "Theory of Everything", out: "theory of everything"}   # "the" only as a word
  - {in: "Les Misérables", out: "les miserables"}               # diacritics
  - {in: "ÆON", out: "æon"}                                     # no decomposition, kept
  - {in: "STRASSE", out: "strasse"}                             # casefold
  - {in: "Straße", out: "strasse"}                              # casefold, not lower
  - {in: "Pride & Prejudice", out: "pride and prejudice"}
  - {in: "Dune: Messiah", out: "dune messiah"}
  - {in: "Don't Panic!", out: "don t panic"}                    # a space per mark
  - {in: "Sci-Fi—Stories", out: "sci fi stories"}               # dashes too
  - {in: "The Way of Kings (The Stormlight Archive, #1)", out: "way of kings"}   # series
  - {in: "Skin Game (The Dresden Files, #15.5)", out: "skin game"}              # decimals
  - {in: "Mistborn (Mistborn #1)", out: "mistborn"}                             # no comma
  - {in: "Dune (40th Anniversary Edition)", out: "dune 40th anniversary edition"}  # no #N
  - {in: "The Lord of the Rings, Volume 1", out: "lord of the rings volume 1"}  # no swap
  - {in: "Herbert, Frank", out: "herbert frank"}                # a title is never swapped
  - {in: "Me, Myself, and I", out: "me myself and i"}
  - {in: "", out: ""}

normalise_author:  # author names: the same steps, plus Last, First → First Last
  - {in: "Frank Herbert", out: "frank herbert"}
  - {in: "Herbert, Frank", out: "frank herbert"}
  - {in: "Le Guin, Ursula K.", out: "ursula k le guin"}
  - {in: "Tolkien, J.R.R.", out: "j r r tolkien"}
  - {in: "Brontë, Charlotte", out: "charlotte bronte"}
  - {in: "Smith, Jones, and Co", out: "smith jones and co"}     # only one comma swaps

# Title score = max(token_sort_ratio of the full titles, token_sort_ratio of each title
# before ':'), on normalised text. Author score = the best token_sort_ratio of the source's
# primary author against each candidate author.
title_score:
  - {source: "Dune", candidate: "Dune", at_least: 100}
  - {source: "The Hobbit", candidate: "Hobbit", at_least: 100}
  - {source: "Dune", candidate: "Dune: Book One", at_least: 100}       # subtitle on one side
  - {source: "Dune: Deluxe", candidate: "Dune", at_least: 100}
  - {source: "The Way of Kings (The Stormlight Archive, #1)", candidate: "The Way of Kings", at_least: 100}
  - {source: "Way Kings of", candidate: "The Way of Kings", at_least: 100}   # token sort
  - {source: "Dune", candidate: "Dune Messiah", below: 95}
  - {source: "Dune", candidate: "Children of Dune", below: 60}
  - {source: "", candidate: "Dune", below: 1}
  - {source: ":x", candidate: ":y", below: 1}                        # empty never matches empty
  # The before-':' part scores an adaptation 100 too; the full-title score below (#138) tells
  # them apart.
  - {source: "A Wizard of Earthsea", candidate: "A Wizard of Earthsea: A Graphic Novel", at_least: 100}
  - {source: "Star Wars: A New Hope", candidate: "Star Wars: The Empire Strikes Back", at_least: 100}

full_title_score:  # the full titles alone, for the margin when the top hit's is exact (#138)
  - {source: "A Wizard of Earthsea", candidate: "A Wizard of Earthsea", at_least: 100}
  - {source: "A Wizard of Earthsea", candidate: "A Wizard of Earthsea: A Graphic Novel", below: 90}
  - {source: "The Way of Kings (The Stormlight Archive, #1)", candidate: "The Way of Kings", at_least: 100}

author_score:
  - {source: "Frank Herbert", candidates: ["Frank Herbert"], at_least: 100}
  - {source: "Herbert, Frank", candidates: ["Frank Herbert"], at_least: 100}
  - {source: "Frank Herbert", candidates: ["Brian Herbert", "Frank Herbert"], at_least: 100}
  - {source: "Le Guin, Ursula K.", candidates: ["Ursula K. Le Guin"], at_least: 100}
  # A known weakness for 4a's calibration: spacing inside a surname splits a token.
  - {source: "Ursula K. Le Guin", candidates: ["Ursula K. LeGuin"], at_least: 70, below: 90}
  - {source: "Frank Herbert", candidates: ["Kevin J. Anderson"], below: 50}
  - {source: "Frank Herbert", candidates: [], below: 1}
  - {source: "", candidates: [""], below: 1}

# Decisions over a ranked candidate list: [title score, author score] per candidate, best
# first, or [title, author, full-title score] where the full title differs (#138).
# auto_accept: title >= 95, author >= 90, every other title at least 10 lower; but when the
# top full title is exact (100), the margin compares full-title scores.
# likely (check_books): title >= 85, author >= 80, same margin.
decide:
  - {candidates: [[100, 100]], auto_accept: true, likely: true}
  - {candidates: [[95, 90]], auto_accept: true, likely: true}           # the edges accept
  - {candidates: [[94.9, 100]], auto_accept: false, likely: true}
  - {candidates: [[100, 89.9]], auto_accept: false, likely: true}
  - {candidates: [[100, 100], [90, 100]], auto_accept: true, likely: true}   # margin 10
  - {candidates: [[100, 100], [90.1, 100]], auto_accept: false, likely: false}  # ambiguous
  - {candidates: [[85, 80]], auto_accept: false, likely: true}
  - {candidates: [[84.9, 100]], auto_accept: false, likely: false}
  - {candidates: [[100, 79.9]], auto_accept: false, likely: false}
  - {candidates: [[96, 100], [70, 50], [95, 40]], auto_accept: false, likely: false}  # any other
  - {candidates: [], auto_accept: false, likely: false}
  # #138: the book and its graphic novel both score 100, but only the book's full title does.
  - {candidates: [[100, 100, 100], [100, 100, 69]], auto_accept: true, likely: true}
  # Two exact full titles (two records of one book) stay ambiguous.
  - {candidates: [[100, 100, 100], [100, 100, 100]], auto_accept: false, likely: false}
  # With no exact full title, the before-':' scores decide the margin as before.
  - {candidates: [[100, 100, 80], [100, 100, 70]], auto_accept: false, likely: false}

# The chain (§3.4a.5): the Goodreads mapping, ISBN-13, ISBN-10, then fuzzy; the first step with
# a hit decides. Each case gives Hardcover's side and one source row, and expects either a
# link (method, book) or a queue entry (reason, candidate books in order). accept_fuzzy is
# false in the backfill, which never auto-links on title and author alone.
#   hardcover.mappings: {goodreads id: [{book, title}]}   (several rows = several books)
#   hardcover.books:    {book: {title, canonical}}
#   hardcover.editions: [{id, book, isbn_13?, isbn_10?}]
#   hardcover.search:   [{book, title, authors}]          (Typesense documents, in rank order)
chain:
  - name: the Goodreads mapping wins
    hardcover:
      mappings: {"100": [{book: 7, title: Dune}]}
      editions: [{id: 71, book: 8, isbn_13: "9780441013593"}]
    row: {id: "100", title: Dune, author: Frank Herbert, isbn13: "9780441013593"}
    expect: {method: gr_mapping, book: 7}

  - name: a merged book counts as the book it was merged into
    hardcover:
      mappings: {"100": [{book: 7, title: Dune}]}
      books: {7: {title: Dune, canonical: 70}}
    row: {id: "100", title: Dune, author: Frank Herbert}
    expect: {method: gr_mapping, book: 70}

  - name: an id hit whose title is far off is queued, the hit its candidate
    hardcover:
      mappings: {"100": [{book: 7, title: "Bertrand Barère 1755-1841"}]}
    row: {id: "100", title: Dune, author: Frank Herbert}
    expect: {reason: id_title_mismatch, candidates: [7]}

  - name: a title scoring exactly the floor (60) is accepted
    hardcover:
      mappings: {"100": [{book: 7, title: "Leviathan Falls"}]}
    row: {id: "100", title: "Leviathan Wakes", author: James S. A. Corey}
    expect: {method: gr_mapping, book: 7}

  - name: a title just under the floor (58) is queued
    hardcover:
      mappings: {"100": [{book: 7, title: "Leviathan Fallen"}]}
    row: {id: "100", title: "Leviathan Wakes", author: James S. A. Corey}
    expect: {reason: id_title_mismatch, candidates: [7]}

  - name: a mapping naming two books is ambiguous (#185)
    hardcover:
      mappings: {"100": [{book: 7, title: Dune}, {book: 9, title: Dune}]}
    row: {id: "100", title: Dune, author: Frank Herbert}
    expect: {reason: ambiguous_mapping, candidates: [7, 9]}

  - name: two mapping rows on one book are one hit
    hardcover:
      mappings: {"100": [{book: 7, title: Dune}, {book: 7, title: Dune}]}
    row: {id: "100", title: Dune, author: Frank Herbert}
    expect: {method: gr_mapping, book: 7}

  - name: with no mapping, ISBN-13 comes next, however it is written
    hardcover:
      editions: [{id: 71, book: 7, isbn_13: "9780441013593"}, {id: 81, book: 8, isbn_10: "0441013597"}]
      books: {7: {title: Dune}, 8: {title: Dune}}
    row: {id: "100", title: Dune, author: Frank Herbert, isbn13: "978-0-441-01359-3", isbn10: "0441013597"}
    expect: {method: isbn13, book: 7}

  - name: then ISBN-10, with its X
    hardcover:
      editions: [{id: 81, book: 8, isbn_10: "080441234X"}]
      books: {8: {title: Example Book}}
    row: {id: "100", title: "Example Book (Example Series, #2)", author: Ann Author, isbn10: "080441234x"}
    expect: {method: isbn10, book: 8}

  - name: a clear fuzzy match links outside the backfill
    hardcover:
      search: [{book: 7, title: Dune, authors: [Frank Herbert]}]
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {method: fuzzy, book: 7}

  - name: the backfill never links on title and author alone
    hardcover:
      search: [{book: 7, title: Dune, authors: [Frank Herbert]}]
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: false
    expect: {reason: fuzzy_low, candidates: [7]}

  - name: two books with one title are ambiguous
    hardcover:
      search: [{book: 7, title: Dune, authors: [Frank Herbert]}, {book: 9, title: Dune, authors: [Frank Herbert]}]
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {reason: fuzzy_ambiguous, candidates: [7, 9]}

  - name: a weak author match is low
    hardcover:
      search: [{book: 7, title: Dune, authors: [Kevin J. Anderson]}]
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {reason: fuzzy_low, candidates: [7]}

  - name: hits below the title floor are not kept
    hardcover:
      search: [{book: 7, title: Children of Dune, authors: [Frank Herbert]}]
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {reason: no_hit, candidates: []}

  - name: a fuzzy hit follows canonical_id too
    hardcover:
      search: [{book: 7, title: Dune, authors: [Frank Herbert]}]
      books: {7: {title: Dune, canonical: 70}}
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {method: fuzzy, book: 70}

  - name: with no author a fuzzy hit is never accepted
    hardcover:
      search: [{book: 7, title: Dune, authors: [Frank Herbert]}]
    row: {id: "100", title: Dune, author: null}
    accept_fuzzy: true
    expect: {reason: fuzzy_low, candidates: [7]}

  - name: nothing anywhere is no_hit
    hardcover: {}
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {reason: no_hit, candidates: []}

  - name: a refused mapping lets an exact ISBN settle the row (#190)
    hardcover:
      mappings: {"100": [{book: 9, title: "Bertrand Barère 1755-1841"}]}
      editions: [{id: 71, book: 7, isbn_13: "9780441013593"}]
      books: {7: {title: Dune}}
    row: {id: "100", title: Dune, author: Frank Herbert, isbn13: "9780441013593"}
    expect: {method: isbn13, book: 7}

  - name: an ambiguous mapping lets an exact ISBN settle the row (#190)
    hardcover:
      mappings: {"100": [{book: 7, title: Dune}, {book: 9, title: Dune}]}
      editions: [{id: 71, book: 7, isbn_13: "9780441013593"}]
      books: {7: {title: Dune}}
    row: {id: "100", title: Dune, author: Frank Herbert, isbn13: "9780441013593"}
    expect: {method: isbn13, book: 7}

  - name: a title search never overrides an exact id that disagreed (#190)
    hardcover:
      mappings: {"100": [{book: 9, title: "Bertrand Barère 1755-1841"}]}
      search: [{book: 7, title: Dune, authors: [Frank Herbert]}]
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {reason: id_title_mismatch, candidates: [9]}

  - name: an ISBN naming several books is ambiguous too (#190)
    hardcover:
      editions: [{id: 71, book: 7, isbn_13: "9780441013593"}, {id: 72, book: 8, isbn_13: "9780441013593"}]
      books: {7: {title: Dune}, 8: {title: Dune}}
    row: {id: "100", title: Dune, author: Frank Herbert, isbn13: "9780441013593"}
    expect: {reason: ambiguous_mapping, candidates: [7, 8]}

  - name: an ambiguous mapping lists its best-titled book first
    hardcover:
      mappings: {"100": [{book: 9, title: "Bertrand Barère 1755-1841"}, {book: 7, title: Dune}]}
    row: {id: "100", title: Dune, author: Frank Herbert}
    expect: {reason: ambiguous_mapping, candidates: [7, 9]}

  - name: two search records of one merged book are one candidate, so it links
    hardcover:
      search: [{book: 7, title: Dune, authors: [Frank Herbert]}, {book: 11, title: Dune, authors: [Frank Herbert]}]
      books: {11: {title: Dune, canonical: 7}}
    row: {id: "100", title: Dune, author: Frank Herbert}
    accept_fuzzy: true
    expect: {method: fuzzy, book: 7}
