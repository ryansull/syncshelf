# gitleaks: the default rules, plus the placeholders SPEC §2.6 tells us to use everywhere.
# Used by the pre-commit hook and by CI.

[extend]
useDefault = true

# A finding is dropped only when its extracted secret is, in full, one placeholder. The
# patterns are anchored and tested against the secret, not the whole match or line, so a real
# credential next to a placeholder host, or with one appended, is still reported.
[[allowlists]]
description = "SPEC §2.6 placeholders"
regexTarget = "secret"
regexes = [
  '''(?i)^(?:[a-z0-9-]+\.)*example\.(?:com|net|org)$''',
  '''(?i)^(?:[a-z0-9-]+\.)+home\.arpa$''',
  '''^192\.0\.2\.\d{1,3}$''',
  '''(?i)^(?:alice|bob)@example\.com$''',
]
