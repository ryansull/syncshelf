# SPEC §2.10 and §3.1: a version tag publishes the image for amd64 and arm64 to
# ghcr.io/<owner>/syncshelf:<version> and :latest. Nothing else triggers this workflow; CI's
# image job checks the image on every PR without pushing.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the automatic GITHUB_TOKEN; no stored secret
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the package version
        # The app reports its version from package metadata, so an image tagged 0.1.0 must
        # contain a package that says 0.1.0. Until #52 decides otherwise, the release PR bumps
        # pyproject.toml (and uv.lock) and this refuses a tag that disagrees.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag $TAG, package $version"
          test "$TAG" = "v$version"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/syncshelf
          # v0.1.0 → :0.1.0, without the v (#52), plus :latest for a non-pre-release tag.
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
